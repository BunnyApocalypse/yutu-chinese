<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page use the phone's real width instead of a zoomed-out desktop layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玉兔 Yutu</title>
    <!-- The manifest tells a phone how to install the app: its name, icon and colors. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f1e9d4" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <!-- The top of the page: the menu button and where you are. While a
           card is up only the button stays, in the corner (main.focused). -->
      <header class="top-bar">
        <button id="menu-button" class="icon-button menu-button" type="button" data-t-aria-label="menu.menu" data-t-title="menu.menu" aria-controls="side-menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
            <!-- Three lines. -->
            <rect x="3" y="5" width="18" height="2.2" rx="1.1" /><rect x="3" y="10.9" width="18" height="2.2" rx="1.1" /><rect x="3" y="16.8" width="18" height="2.2" rx="1.1" />
          </svg>
        </button>
        <!-- In Free practice opened with "Practice" on a word's page: back to
             that page, before "Practicing a word" (main.js). -->
        <button id="practice-word-back" class="top-back top-back-arrow" type="button" hidden><svg class="back-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg></button>
        <span id="place-title" class="place-title" data-t="menu.review"></span>
        <!-- On a deck's page, in place of the screen's name: up one level, to
             the deck it is inside or the front page (decksPanel.js). -->
        <!-- Every arrow in the app, back or on, is drawn, as heavy as the
             menu's lines (the owner, 2026-10-17: a "‹" in the font was too
             small), and they all match: the same path wherever one is. -->
        <button id="deck-back-button" class="top-back" type="button" hidden><svg class="back-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg><span id="deck-back-label" data-t="menu.decks"></span></button>
        <!-- In Free practice opened from Settings: back to Settings' Writing
             group, where it was opened (main.js). -->
        <!-- In Review or Learn opened from Decks (a deck's row, the buttons on
             its page, "Learn it now"): back to where it was left (main.js). -->
        <button id="study-back-button" class="top-back" type="button" hidden><svg class="back-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg><span id="study-back-label" data-t="menu.decks"></span></button>
        <button id="practice-back-button" class="top-back" type="button" hidden><svg class="back-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg><span data-t="menu.settings"></span></button>
      </header>
      <!-- The menu: a panel that slides in from the left (main.js). The
           buttons keep the IDs they had as tabs. -->
      <dialog id="side-menu" class="side-menu" data-t-aria-label="menu.menu">
        <nav id="main-tabs" class="side-menu-items">
          <button id="review-tab" class="selected" type="button" data-t="menu.review"></button>
          <!-- Only when words are waiting, with how many (main.js; the owner,
               2026-10-16: two taps to Learn on a day with cards due). -->
          <button id="learn-tab" type="button" hidden><span data-t="menu.learn"></span> <span id="learn-waiting" class="menu-count"></span></button>
          <button id="decks-tab" type="button" data-t="menu.decks"></button>
          <button id="words-tab" type="button" data-t="menu.words"></button>
          <button id="progress-tab" type="button" data-t="menu.progress"></button>
        </nav>
        <div class="side-menu-items side-menu-bottom">
          <!-- For someone new to Chinese (the owner, 2026-10-21; basics.js). -->
          <button id="basics-button" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <!-- An open book. -->
              <path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14" />
            </svg>
            <span data-t="menu.basics"></span>
          </button>
          <!-- Where strangers find it (the owner, 2026-10-18; feedback.js). -->
          <button id="feedback-button" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <!-- A speech bubble. -->
              <path d="M4 5h16v11H10l-5 4v-4H4z" />
            </svg>
            <span data-t="menu.feedback"></span>
          </button>
          <button id="settings-button" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
              <!-- Eight teeth around a ring. -->
              <rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(0 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(45 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(90 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(135 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(180 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(225 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(270 12 12)" /><rect x="10.6" y="1.5" width="2.8" height="5" rx="0.8" transform="rotate(315 12 12)" />
              <path fill-rule="evenodd" d="M12 5.2a6.800 6.800 0 1 0 0 13.600 6.800 6.800 0 0 0 0-13.600Zm0 3.900a2.900 2.900 0 1 1 0 5.800 2.900 2.900 0 0 1 0-5.800Z" />
            </svg>
            <span data-t="menu.settings"></span>
          </button>
          <!-- Says what the red dot is about (main.js, showBackupStatus). -->
          <p id="backup-due-line" class="backup-due-line" hidden data-t="menu.backupDue"></p>
        </div>
      </dialog>

      <!-- Review mode: what is left to do, and the prompt for the current word -->
      <section id="review-header" class="review-header">
        <!-- Which deck is studied; only there once there are decks (review.js). -->
        <div class="counts-row">
          <select id="deck-select" class="deck-select" data-t-aria-label="review.deckToStudy" hidden></select>
          <p id="review-counts" class="counts"></p>
        </div>
        <!-- Says so when the card just graded was suspended as a leech (review.js). -->
        <p id="review-notice" role="status" class="note" hidden></p>
        <!-- Which kind of card this is: Writing, Tone, Pinyin or Meaning -->
        <div class="type-row">
          <p id="card-type" class="card-type"></p>
          <!-- Speaks the word (review.js, speech.js). The picture is a loudspeaker. -->
          <button id="listen-button" class="icon-button" type="button" data-t-aria-label="review.hearTheWord" data-t-title="review.hearTheWord" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <!-- On a writing card: shows the word's pinyin, which does not count against the grade. -->
          <button id="pinyin-button" class="link-button" type="button" hidden data-t="review.pinyinButton"></button>
          <!-- Once the answer is showing: the word's page, and its panel to correct it
               (review.js). Up here, so that nothing is added under the writing area. -->
          <button id="about-word-button" class="link-button" type="button" data-t-title="review.aboutThisWord" hidden data-t="review.aboutWordButton"></button>
          <button id="edit-word-button" class="link-button" type="button" data-t-title="review.editThisWord" hidden data-t="review.editWordButton"></button>
        </div>
        <p id="prompt-meaning" class="meaning"></p>
        <p id="prompt-pinyin" class="pinyin" hidden></p>
        <!-- The lesson for a new word: what this step asks for (review.js). -->
        <div class="lesson-row">
          <p id="lesson-note" class="hint" hidden></p>
          <!-- Skips the lesson: the word is known (review.js). Beside the note,
               so that it takes no room of its own on a phone. -->
          <button id="skip-lesson-button" class="link-button" type="button" data-t-title="review.skipThisWordsLesson" hidden data-t="review.skipLessonButton"></button>
        </div>
      </section>

      <!-- Free practice mode: type a character or word and choose a kind of card -->
      <form id="word-form" class="word-form" hidden>
        <input
          id="word-input"
          type="text"
          value="學"
          data-t-placeholder="review.characterOrWord"
          data-t-aria-label="review.characterOrWordTo"
          autocomplete="off"
          autocapitalize="off"
          list="word-suggestions"
        />
        <!-- Suggestions for the text box: the words in the word list. Filled in by main.js. -->
        <datalist id="word-suggestions"></datalist>
        <select id="practice-type" data-t-aria-label="review.kindOfCard">
          <option value="writing" data-t="review.writing"></option>
          <option value="tone" data-t="review.tone"></option>
          <option value="pinyin" data-t="review.pinyin"></option>
          <option value="meaning" data-t="review.meaning"></option>
        </select>
        <button id="practice-go" type="submit" data-t="review.practiceGo"></button>
      </form>
      <!-- Said on every practice screen (the owner, 2026-10-17). -->
      <p id="practice-note" class="hint practice-note" hidden data-t="review.practiceNote"></p>
      <p id="note" role="status" class="note"></p>

      <!-- Review mode, when nothing is due -->
      <!-- Opening Review with many cards to do: how many to review this time,
           all or a set number (review.js; tester 4 and the owner, 2026-10-22).
           Switched off in Settings, Review starts at once on all of them. -->
      <div id="review-start" class="done-panel review-start" hidden>
        <h2 id="review-start-count" class="done-heading"></h2>
        <p data-t="review.startQuestion"></p>
        <button id="review-all-button" class="primary" type="button" data-t="review.allButton"></button>
        <div id="review-limit-buttons" class="buttons review-limits" role="group" data-t-aria-label="review.limitGroup">
          <button type="button" data-limit="20">20</button>
          <button type="button" data-limit="50">50</button>
          <button type="button" data-limit="100">100</button>
          <button id="review-other-button" type="button" data-t="review.otherButton"></button>
        </div>
        <form id="review-other-form" class="review-other" hidden>
          <label><span data-t="review.otherLabel"></span> <input id="review-other-input" type="number" min="1" step="1" inputmode="numeric" /></label>
          <button type="submit" data-t="review.otherStart"></button>
        </form>
        <p class="hint" data-t="review.startHint"></p>
      </div>
      <div id="done-panel" class="done-panel" hidden>
        <!-- A line of text, or at the end of Review a short summary of the day
             (doneSummary in review.js). -->
        <div id="done-message" role="status"></div>
        <!-- In Learn, between two words: on to the next one; in Review, with
             nothing due and words waiting: to Learn (review.js, main.js). -->
        <button id="learn-next-button" class="primary" type="button" hidden data-t="review.learnNextButton"></button>
        <!-- With no words at all: the ready-made level suggested to start
             with, added and opened in Learn (review.js, main.js). -->
        <button id="start-level-button" class="primary" type="button" hidden data-t="review.startLevelButton"></button>
        <!-- With no words, or none left to learn: to the Decks tab (review.js, main.js). -->
        <button id="add-words-button" class="primary" type="button" hidden data-t="review.addWordsButton"></button>
        <!-- With no words at all: Decks' ready-made levels (review.js, main.js). -->
        <button id="other-level-button" class="link-button" type="button" hidden data-t="review.otherLevelButton"></button>
        <!-- At the end of a lesson repeated: back to the word's page, as the
             top bar's "‹ Back" (review.js, main.js). -->
        <button id="lesson-back-button" type="button" hidden data-t="review.lessonBackButton"></button>
        <!-- At the end of Review: the card graded last, to change its grade,
             as the ‹ arrow on a card does (review.js). -->
        <!-- At the end of a Review of a set number of cards, with cards still
             to do: the same number again (review.js). -->
        <button id="review-more-button" class="primary" type="button" hidden></button>
        <button id="look-back-button" class="link-button" type="button" hidden data-t="review.lookBackButton"></button>
        <!-- At the end of Review and between two words in Learn, every time,
             while the browser may delete the words (storageMessage.js). -->
        <div id="storage-message" class="storage-message" hidden>
          <p><b data-t="storageMessage.title"></b> <span id="storage-message-advice"></span></p>
          <div class="buttons">
            <button id="storage-message-keep" class="small primary" type="button" data-t="storageMessage.keep"></button>
            <button id="storage-message-close" class="small" type="button" data-t="storageMessage.notNow"></button>
          </div>
        </div>
      </div>

      <!-- The Decks tab: the decks, the words in them, and the ready-made
           decks to add. Run by wordsPanel.js and decksPanel.js. -->
      <section id="words-panel" class="words-panel" hidden>
        <!-- The tab's two sections. -->
        <nav class="section-switch">
          <button id="my-decks-button" class="selected" type="button" data-t="decks.myDecksButton"></button>
          <button id="ready-decks-button" type="button" data-t="decks.readyDecksButton"></button>
        </nav>

        <!-- Ready-made decks: the word lists of the official tests. -->
        <section id="ready-decks-section" class="words-panel" hidden>
          <p class="hint" data-t-html="decks.theseAreTheWord"></p>
          <!-- The lists to choose from; tapping one shows its levels below
               (wordsPanel.js). data-list is the list's ID, as in READY_MADE_LISTS. -->
          <ul id="ready-list" class="word-list">
            <li>
              <button class="word-entry deck-entry ready-entry" type="button" data-list="hsk-3.0">
                <span class="entry-characters" data-t="decks.hsk30"></span>
                <span class="entry-definition" data-t="decks.mainlandChinasTestAs"></span>
              </button>
            </li>
            <li>
              <button class="word-entry deck-entry ready-entry" type="button" data-list="hsk-2.0">
                <span class="entry-characters" data-t="decks.hsk20Older"></span>
                <span class="entry-definition" data-t="decks.theSixLevelStandard"></span>
              </button>
            </li>
            <li>
              <button class="word-entry deck-entry ready-entry" type="button" data-list="tocfl">
                <span class="entry-characters" data-t="decks.tocflTaiwan"></span>
                <span class="entry-definition" data-t="decks.taiwansTestTwoNovice"></span>
              </button>
            </li>
            <li>
              <button class="word-entry deck-entry ready-entry" type="button" data-list="radicals">
                <span class="entry-characters"><span data-t="decks.radicals"></span> <span lang="zh-Hant-TW">部首</span></span>
                <span class="entry-definition" data-t-html="decks.radicalsExplained"></span>
              </button>
            </li>
          </ul>
          <!-- One row per level, with how many of its words are new and a
               button to add it. Filled in by wordsPanel.js. -->
          <h3 id="ready-levels-title" class="ready-levels-title" data-t="decks.readyLevelsTitle"></h3>
          <ul id="ready-levels" class="ready-levels"></ul>
          <!-- What adding makes, worded for the list chosen (wordsPanel.js). -->
          <p id="ready-levels-hint" class="hint"></p>
          <p id="ready-report" role="status" class="note"></p>
        </section>

        <!-- My decks: either the front page, with the decks that are inside no
             other, or one deck's page. -->
        <section id="my-decks-section" class="words-panel">
          <!-- Where you are: Decks › Textbook › Chapter 2. Each part is a button. -->
          <!-- What the Decks tab shows of this section: the decks. -->
          <div id="decks-part" class="words-panel">
          <div id="deck-path-row" class="deck-path-row" hidden>
            <nav id="deck-path" class="deck-path" data-t-aria-label="decks.whereYouAre"></nav>
          </div>
          <!-- Only on a deck's page. -->
          <div id="deck-head" hidden>
            <div class="deck-title-row">
              <h2 id="deck-title"></h2>
              <button id="deck-settings-button" class="icon-button" type="button" data-t-aria-label="decks.deckSettings" data-t-title="decks.deckSettings">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor">
                  <!-- A cog wheel: eight teeth (a dashed ring) round a ring. -->
                  <circle cx="12" cy="12" r="8.5" stroke-width="3" stroke-dasharray="3.34 3.34" />
                  <circle cx="12" cy="12" r="5.5" stroke-width="2.6" />
                </svg>
              </button>
            </div>
            <p id="deck-counts" class="hint"></p>
            <!-- A bar filled as far as the deck's words are learned (decksPanel.js). -->
            <div id="deck-progress" class="deck-progress" hidden></div>
            <!-- One main button, Learn while words wait and then Review, the
                 other small beside it (decksPanel.js; the owner, 2026-10-16). -->
            <div class="deck-study">
              <!-- On a deck without words, in the main button's place (decksPanel.js). -->
              <button id="deck-add-button" class="primary" type="button" hidden data-t="decks.deckAddButton"></button>
              <button id="deck-learn-button" class="primary" type="button" data-t="decks.deckLearnButton"></button>
              <button id="deck-review-button" type="button" data-t="decks.deckReviewButton"></button>
            </div>
          </div>

          <!-- The heading, with the button for a new deck beside it, so that it
               stays in reach however many decks there are. -->
          <div class="list-heading">
            <h2 id="deck-list-title" data-t="decks.deckListTitle"></h2>
            <button id="new-deck-button" class="small" type="button" data-t="decks.newDeckButton"></button>
          </div>
          <ul id="deck-list" class="word-list"></ul>
          <!-- Naming a new deck, in a panel of its own (decksPanel.js). -->
          <dialog id="new-deck-dialog" class="settings-panel">
            <form id="add-deck-form">
              <h2 id="new-deck-title" data-t="decks.newDeckTitle"></h2>
              <input id="add-deck-name" type="text" data-t-placeholder="decks.nameOfTheDeck" data-t-aria-label="decks.nameOfTheDeck" autocomplete="off" />
              <div class="buttons">
                <button id="new-deck-cancel" class="small" type="button" data-t="decks.newDeckCancel"></button>
                <button class="small primary" type="submit" data-t="decks.createDeck"></button>
              </div>
            </form>
            <!-- Bringing decks over from Anki (ankiImportForm.js). Only on the
                 front page (decksPanel.js): it makes decks of its own. -->
            <p id="anki-import-row" class="anki-import-row">
              <button id="anki-import-button" class="link-button" type="button" data-t="decks.ankiImportButton"></button>
            </p>
            <button data-same-as="new-deck-cancel" class="dialog-close" type="button" data-t-aria-label="common.close" data-t-title="common.close"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18" /></svg></button>
          </dialog>

          <!-- Adding words: only on a deck's page, since every word is in a deck. -->
          <div id="deck-adding" class="words-panel" hidden>
            <!-- Adding to the deck whose page is open: one panel, opened by
                 "+ Add to deck", with three tabs at its top for a word, a list
                 or a sentence (wordsPanel.js; the owner, 2026-10-16: until then
                 three fold-outs on the deck's page). -->
            <dialog id="add-dialog" class="settings-panel add-dialog">
              <div class="settings-heading">
                <h2 id="add-title"><span data-t="decks.addTo"></span> <span id="add-to-deck-name"></span></h2>
                <button id="add-close" class="small" type="button" data-t="decks.addClose"></button>
              </div>
              <nav id="add-choices" class="add-choices" data-t-aria-label="decks.whatToAdd">
                <button type="button" data-add="add-word-fold" data-t="decks.oneWord"></button>
                <button type="button" data-add="add-list-fold" data-t="decks.aListOfWords"></button>
                <button type="button" data-add="add-sentence-fold" data-t="decks.aSentence"></button>
              </nav>
            <section id="add-word-fold" class="add-form" hidden>
            <form id="add-word-form" class="add-word-form">
              <input id="add-traditional" type="text" data-t-placeholder="decks.traditional" data-t-aria-label="decks.traditionalCharacters" lang="zh-Hant-TW" autocomplete="off" autocapitalize="off" />
              <input id="add-simplified" type="text" data-t-placeholder="decks.simplifiedIfDifferent" data-t-aria-label="decks.simplifiedCharactersIfDifferent" lang="zh-Hans-CN" autocomplete="off" autocapitalize="off" />
              <!-- What the dictionary has for the characters typed, and whether the
                   word is in the list already. Filled in by wordsPanel.js. -->
              <div id="add-suggestions" class="suggestions"></div>
              <input id="add-pinyin" type="text" data-t-placeholder="decks.pinyinWithToneNumbers" data-t-aria-label="decks.pinyinWithToneNumbers2" autocomplete="off" autocapitalize="off" spellcheck="false" />
              <!-- The pinyin with tone marks, as a check on what was typed. -->
              <p id="add-pinyin-preview" class="pinyin-preview"></p>
              <input id="add-pinyin-taiwan" type="text" data-t-placeholder="decks.taiwanReadingIfDifferent" data-t-aria-label="decks.taiwanReadingIfDifferent2" autocomplete="off" autocapitalize="off" spellcheck="false" />
              <input id="add-definition" type="text" data-t-placeholder="decks.meaning" data-t-aria-label="decks.meaning" autocomplete="off" />
              <!-- Only shown while both scripts are being learned (wordsPanel.js). -->
              <label id="add-card-script-row" class="setting">
                <span data-t="decks.cardsIn"></span>
                <select id="add-card-script">
                  <option value="" data-t="decks.asInSettings"></option>
                  <option value="traditional" data-t="decks.traditional"></option>
                  <option value="simplified" data-t="decks.simplified"></option>
                </select>
              </label>
              <button type="submit" class="primary" data-t="decks.addWord"></button>
              <p id="add-word-note" role="status" class="note"></p>
              <!-- After a word is added that is still to be learned (wordsPanel.js). -->
              <button id="add-learn-now" class="small" type="button" hidden data-t="decks.addLearnNow"></button>
            </form>
            </section>

            <section id="add-list-fold" class="add-form" hidden>
              <!-- Which columns a list has; worded by wordsPanel.js to suit the settings. -->
              <p id="list-hint" class="hint"></p>
              <textarea id="list-text" rows="6" data-t-aria-label="decks.wordList" spellcheck="false"></textarea>
              <div class="buttons">
                <button id="list-file-button" class="small" type="button" data-t="decks.listFileButton"></button>

        <div class="settings-heading">
          <button id="settings-back" class="settings-back" type="button" hidden><svg class="back-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19" /></svg><span data-t="settings.title"></span></button>
          <h2 id="settings-title" data-t="settings.title"></h2>
          <button id="settings-close" class="small" type="button" data-t="settings.done"></button>
        </div>

        <!-- One group at a time (the owner, 2026-10-16, from a tester's
             suggestion): on a phone, a list of the groups, and a tap shows one;
             on a wider screen the list stays at the side (settings.js). -->
        <div class="settings-body">
        <nav id="settings-nav" class="settings-nav" data-t-aria-label="settings.groups">
          <button type="button" data-group="settings-learning" data-t="settings.chinese"></button>
          <button type="button" data-group="settings-studying" data-t="settings.dailyStudy"></button>
          <button type="button" data-group="settings-writing" data-t="settings.writing"></button>
          <button type="button" data-group="settings-look" data-t="settings.lookAndSound"></button>
          <button type="button" data-group="settings-data" data-t="settings.data"></button>
          <button type="button" data-group="settings-help" data-t="settings.help"></button>
          <button type="button" data-group="settings-testing" hidden data-t="settings.testing"></button>
        </nav>
        <div class="settings-pages">

        <!-- A "?" beside a setting shows the explanation named in its aria-controls (settings.js). -->
        <!-- The settings are in groups, so that each thing can be found under a
             heading; they folded away until 2026-10-16. Regrouped on 2026-10-15
             (the owner: Look under "Studying" made no sense): Chinese (what is learned and tested), Daily study, Writing, Look and
             sound, Your data and backups, Help. -->
        <section id="settings-learning" class="settings-group" hidden>
          <h3 data-t="settings.chinese"></h3>
        <div class="setting">
          <span>
            <label for="script-select" data-t="settings.script"></label>
            <button class="help-button" type="button" data-t-aria-label="settings.whatDoesThisDo" aria-expanded="false" aria-controls="script-hint">?</button>
          </span>
          <select id="script-select">
            <option value="simplified" data-t="settings.scriptSimplified"></option>
            <option value="traditional" data-t="settings.scriptTraditional"></option>
            <option value="both-simplified" data-t="settings.scriptBothSimplified"></option>
            <option value="both-traditional" data-t="settings.scriptBothTraditional"></option>
          </select>
          <p id="script-hint" class="hint" hidden data-t-html="settings.scriptHint"></p>
        </div>

        <div class="setting">
          <span>
            <label for="pronunciation-select" data-t="settings.pronunciation"></label>
            <button class="help-button" type="button" data-t-aria-label="settings.whatDoesThisDo" aria-expanded="false" aria-controls="pronunciation-hint">?</button>
          </span>
          <select id="pronunciation-select">
            <option value="mainlandOnly" data-t="settings.pronunciationMainland"></option>
            <option value="taiwan" data-t="settings.pronunciationTaiwan"></option>
            <!-- Both readings, the mainland one listed first. -->
            <option value="mainland" data-t="settings.pronunciationBoth"></option>
          </select>
          <p id="pronunciation-hint" class="hint" hidden data-t-html="settings.pronunciationHint"></p>
        </div>

        <fieldset class="setting">
          <legend data-t="settings.cardTypes"></legend>
          <label><input type="checkbox" data-card-type="meaning" /> <span data-t="settings.cardTypeMeaning"></span></label>
          <label><input type="checkbox" data-card-type="pinyin" /> <span data-t="settings.cardTypePinyin"></span></label>
          <label><input type="checkbox" data-card-type="tone" /> <span data-t="settings.cardTypeTone"></span></label>
          <label><input type="checkbox" data-card-type="writing" /> <span data-t="settings.cardTypeWriting"></span></label>
        </fieldset>

        <fieldset class="setting">
          <legend data-t="settings.sentences"></legend>
          <label><input id="sentence-reading-checkbox" type="checkbox" /> <span data-t="settings.sentenceReading"></span></label>
          <label class="setting">
            <span data-t="settings.sentenceWriting"></span>
            <select id="sentence-writing-select">
              <option value="word" data-t="settings.sentenceWritingWord"></option>
              <option value="sentence" data-t="settings.sentenceWritingSentence"></option>
              <option value="off" data-t="settings.sentenceWritingOff"></option>
            </select>
          </label>
          <span class="hint" data-t="settings.sentencesHint"></span>
        </fieldset>

        <div class="setting">
          <span>
            <label for="meaning-detail-select" data-t="settings.meaningDetail"></label>
            <button id="meaning-detail-help" class="help-button" type="button" data-t-aria-label="settings.whatDoesThisDo" aria-expanded="false" aria-controls="meaning-detail-hint">?</button>
          </span>
          <select id="meaning-detail-select">
            <option value="first" data-t="settings.meaningDetailFirst"></option>
            <option value="everyday" data-t="settings.meaningDetailEveryday"></option>
            <option value="all" data-t="settings.meaningDetailAll"></option>
          </select>
          <p id="meaning-detail-hint" class="hint" hidden data-t-html="settings.meaningDetailHint"></p>
        </div>
        </section>

        <section id="settings-studying" class="settings-group" hidden>
          <h3 data-t="settings.dailyStudy"></h3>
        <label class="setting">
          <span data-t="settings.newWordsPerDay"></span>
          <input id="new-words-input" type="number" min="0" max="50" inputmode="numeric" />
        </label>

        <label class="setting">
          <span data-t="settings.gradeButtons"></span>
          <select id="grade-buttons-select">
            <option value="four" data-t="settings.gradeButtonsFour"></option>
            <option value="two" data-t="settings.gradeButtonsTwo"></option>
          </select>
          <span class="hint" data-t="settings.gradeButtonsHint"></span>
        </label>

        <div class="setting">
          <label><input id="review-start-checkbox" type="checkbox" /> <span data-t="settings.reviewStart"></span></label>
          <p class="hint" data-t="settings.reviewStartHint"></p>
        </div>

        <div class="setting">
          <label><input id="lessons-checkbox" type="checkbox" /> <span data-t="settings.lessons"></span></label>
          <p class="hint" data-t="settings.lessonsHint"></p>
        </div>

        <label class="setting">
          <span data-t="settings.leechAfter"></span>
          <input id="leech-input" type="number" min="2" max="30" inputmode="numeric" data-t-aria-label="settings.leechInput" />
          <span class="hint" data-t="settings.leechHint"></span>
        </label>

        <label class="setting">
          <span data-t="settings.leechAction"></span>
          <select id="leech-action-select">
            <option value="flag" data-t="settings.leechActionFlag"></option>
            <option value="suspend" data-t="settings.leechActionSuspend"></option>
          </select>
          <span class="hint" data-t="settings.leechActionHint"></span>
        </label>

        <div class="setting">
          <label><input id="streaks-checkbox" type="checkbox" /> <span data-t="settings.streaks"></span></label>
          <p class="hint" data-t="settings.streaksHint"></p>
        </div>

        <p id="streak-goal" class="setting streak-goal">
          <span data-t="settings.streakGoalStart"></span>
          <input id="streak-cards-input" type="number" min="1" max="500" inputmode="numeric" data-t-aria-label="settings.streakCardsInput" />
          <span data-t="settings.streakGoalMiddle"></span>
          <input id="streak-words-input" type="number" min="1" max="50" inputmode="numeric" data-t-aria-label="settings.streakWordsInput" />
          <span data-t="settings.streakGoalEnd"></span>
        </p>
        </section>

        <section id="settings-writing" class="settings-group" hidden>
          <h3 data-t="settings.writing"></h3>
        <label class="setting">
          <span data-t="settings.handwriting"></span>
          <select id="handwriting-select">
            <option value="raw" data-t="settings.handwritingRaw"></option>
            <option value="snap" data-t="settings.handwritingSnap"></option>
          </select>
        </label>

        <div class="setting">
          <label><input id="stroke-count-checkbox" type="checkbox" /> <span data-t="settings.strokeCount"></span></label>
          <p class="hint" data-t="settings.strokeCountHint"></p>
        </div>

        <div class="setting">
          <label><input id="mistake-count-checkbox" type="checkbox" /> <span data-t="settings.mistakeCount"></span></label>
          <p class="hint" data-t="settings.mistakeCountHint"></p>
        </div>

        <label class="setting">
          <span data-t="settings.hintCounts"></span>
          <select id="hint-select">
            <option value="missed" data-t="settings.hintMissed"></option>
            <option value="hard" data-t="settings.hintHard"></option>
          </select>
          <span class="hint" data-t="settings.hintHint"></span>
        </label>

        <!-- Free practice: any kind of card for any word, without it counting
             (main.js). In Settings since 2026-10-17 (the owner: "mostly a
             debugging tool"; until then a button in the Words tab), here as a
             way to try the settings above. -->
        <div class="setting">
          <button id="practice-button" class="small" type="button" data-t="settings.tryWriting"></button>
          <p class="hint" data-t="settings.tryWritingHint"></p>
        </div>
        </section>

        <section id="settings-look" class="settings-group" hidden>
          <h3 data-t="settings.lookAndSound"></h3>
        <!-- The same three samples as in the introduction (the owner, 2026-10-15). -->
        <fieldset class="setting theme-picker">
          <legend data-t="settings.look"></legend>
          <label class="theme-choice">
            <input type="radio" name="settings-theme" value="light" />
            <span class="theme-swatch light" aria-hidden="true"><img src="icons/swatch.png" alt="" /></span>
            <span data-t="settings.lookLight"></span>
          </label>
          <label class="theme-choice">
            <input type="radio" name="settings-theme" value="dark" />
            <span class="theme-swatch dark" aria-hidden="true"><img src="icons/swatch.png" alt="" /></span>
            <span data-t="settings.lookDark"></span>
          </label>
          <label class="theme-choice">
            <input type="radio" name="settings-theme" value="auto" />
            <span class="theme-swatch auto" aria-hidden="true"><img src="icons/swatch.png" alt="" /><img src="icons/swatch.png" alt="" /></span>
            <span data-t="settings.lookAuto"></span>
          </label>
        </fieldset>

        <label class="setting">
          <span data-t="settings.font"></span>
          <select id="font-select">
            <option value="system" data-t="settings.fontSystem"></option>
            <option value="dyslexic" data-t="settings.fontDyslexic"></option>
          </select>
          <span class="hint" data-t="settings.fontHint"></span>
        </label>

        <label class="setting">
          <span data-t="settings.sound"></span>
          <select id="sound-select">
            <option value="auto" data-t="settings.soundAuto"></option>
            <option value="tap" data-t="settings.soundTap"></option>
            <option value="off" data-t="settings.soundOff"></option>
          </select>
          <span class="hint" data-t="settings.soundHint"></span>
        </label>

        <label class="setting">
          <span data-t="settings.volume"></span>
          <!-- A slider from silent to full; letting go of it speaks 中文 as a sample (settings.js). -->
          <input id="volume-input" type="range" min="0" max="100" step="5" data-t-aria-label="settings.volumeInput" />
          <span class="hint" data-t="settings.volumeHint"></span>
        </label>
        </section>

        <section id="settings-data" class="settings-group" hidden>
          <h3 data-t="settings.data"></h3>
          <!-- Always said, not only when a backup is due (roadmap item 7). -->
          <p class="hint" data-t="settings.dataWhere"></p>
          <!-- How long ago the last backup was made (main.js). -->
          <p id="backup-status" class="hint"></p>
        <div class="setting">
          <button id="export-button" class="small" type="button" data-t="settings.exportBackup"></button>
          <!-- Switching the reminder dot off, or back on (main.js). -->
          <button id="backup-reminder-button" class="small" type="button" data-t="settings.stopBackupReminders"></button>
          <button id="import-button" class="small" type="button" data-t="settings.importBackup"></button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
          <!-- After Export backup: where the file went and what it is for (main.js). -->
          <p id="export-done" class="hint" role="status" hidden></p>
        </div>

        <div class="setting">
          <span data-t="settings.keepingWords"></span>
          <!-- Whether the browser has agreed to keep the app's data, and what to do if not (offline.js). -->
          <p id="keep-data-status" class="hint" data-t="settings.checking"></p>
          <button id="install-button" class="small" type="button" hidden data-t="settings.installApp"></button>
          <button id="keep-data-button" class="small" type="button" hidden data-t="settings.allowStorage"></button>
          <!-- Switching the reminder at the end of Review off, after a warning, or back on (storageMessage.js). -->
          <button id="keep-reminder-button" class="small" type="button" hidden data-t="settings.stopKeepReminder"></button>
        </div>

        <div class="setting">
          <span data-t="settings.offlineUse"></span>
          <!-- How much of the app is saved on this device. Filled in by offline.js. -->
          <p id="offline-status" class="hint" data-t="settings.checking"></p>
          <!-- Saves every recording on the device (offline.js); they are otherwise kept one by one as they are played. -->
          <button id="save-audio-button" class="small" type="button" hidden data-t="settings.saveAudio"></button>
        </div>
        </section>

        <section id="settings-help" class="settings-group" hidden>
          <h3 data-t="settings.help"></h3>
        <div class="setting">
          <button id="settings-basics-button" class="small" type="button" data-t="settings.basics"></button>
          <button id="welcome-again-button" class="small" type="button" data-t="settings.introductionAgain"></button>
          <button id="whats-new-button" class="small" type="button" data-t="settings.whatsNew"></button>
          <button id="settings-feedback-button" class="small" type="button" data-t="settings.sendFeedback"></button>
          <button id="credits-button" class="small" type="button" data-t="settings.credits"></button>
        </div>
        <!-- The tips shown the first time each screen is opened (tips.js). -->
        <div class="setting">
          <label><input id="tips-checkbox" type="checkbox" /> <span data-t="settings.tips"></span></label>
        </div>
        <div class="setting">
          <button id="tips-again-button" class="small" type="button" data-t="settings.tipsAgain"></button>
        </div>
        <!-- Which version of the app this is (errors.js). -->
        <p id="app-version" class="hint"></p>
        </section>

        <!-- Only in the test copy and while developing (testerSettings.js). -->
        <section id="settings-testing" class="settings-group" hidden>
          <h3 data-t="settings.testing"></h3>
        <div class="setting">
          <label><input id="swipe-readout-checkbox" type="checkbox" /> <span data-t="testing.swipeReadout"></span></label>
          <p class="hint" data-t="testing.swipeReadoutHint"></p>
        </div>
        <div class="setting">
          <label><input id="pseudo-language-checkbox" type="checkbox" /> <span data-t="testing.pseudoLanguage"></span></label>
          <p class="hint" data-t="testing.pseudoLanguageHint"></p>
        </div>
        <div class="setting">
          <span data-t="testing.storageReadout"></span>
          <p class="hint" data-t="testing.storageReadoutHint"></p>
          <p id="storage-readout" class="hint" role="status"></p>
          <button id="storage-readout-refresh" class="small" type="button" data-t="testing.checkAgain"></button>
          <button id="storage-readout-ask" class="small" type="button" data-t="testing.askNow"></button>
        </div>
        </section>

        </div>
        </div>
      </dialog>
    </main>

    <!-- A tip beside something the first time it comes up (tips.js). A
         popover, so that it lies above everything else. -->
    <div id="tip-card" class="tip-card" popover="manual" role="status">
      <p id="tip-text"></p>
      <button id="tip-dismiss" class="small primary" type="button" data-t="tips.gotIt"></button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
