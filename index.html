<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page use the phone's real width instead of a zoomed-out desktop layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanzi Trainer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <nav class="tabs">
        <button id="review-tab" class="selected" type="button">Review</button>
        <button id="practice-tab" type="button">Free practice</button>
      </nav>

      <!-- Review mode: what is left to do, and the prompt for the current word -->
      <section id="review-header" class="review-header">
        <p id="review-counts" class="counts"></p>
        <!-- Which kind of card this is: Writing, Tone, Pinyin or Meaning -->
        <p id="card-type" class="card-type"></p>
        <p id="prompt-meaning" class="meaning"></p>
        <p id="prompt-pinyin" class="pinyin" hidden></p>
        <button id="pinyin-button" class="small" type="button" hidden>Show pinyin</button>
      </section>

      <!-- Free practice mode: type any character or word -->
      <form id="word-form" class="word-form" hidden>
        <input
          id="word-input"
          type="text"
          value="學"
          placeholder="Character or word"
          aria-label="Character or word to practice"
          autocomplete="off"
          autocapitalize="off"
        />
        <button type="submit">Practice</button>
      </form>
      <p id="note" class="note"></p>

      <!-- Review mode, when nothing is due -->
      <div id="done-panel" class="done-panel" hidden>
        <p id="done-message"></p>
      </div>

      <div id="study-area" class="study-area">
        <!-- One slot per character of the word. Filled in by wordFlow.js. -->
        <div id="word-row" class="word-row"></div>

        <!-- The status line. In Review, once a character is written, the two
             verdict buttons appear next to it. -->
        <div id="status-row" class="status-row">
          <p id="status" class="status"></p>
          <div id="verdict-row" class="verdict-row" hidden>
            <button id="missed-button" class="small verdict missed" type="button">Missed</button>
            <button id="got-it-button" class="small verdict passed" type="button">Got it</button>
          </div>
        </div>

        <!-- Hanzi Writer draws the character into this SVG. wordFlow.js sets its size and adds the guide grid. -->
        <svg id="writing-area" class="writing-area"></svg>

        <!-- Takes the writing area's place on tone, pinyin and meaning cards: shows the
             characters large, and the answer once given or revealed. -->
        <div id="card-face" class="card-face" hidden></div>

        <div id="writing-buttons" class="buttons">
          <button id="restart-button" type="button">Restart</button>
          <button id="outline-button" type="button">Show outline</button>
          <button id="animate-button" type="button">Animate</button>
          <button id="next-button" class="primary" type="button" hidden>Next</button>
        </div>

        <!-- Tone cards: one button per tone. The last is the neutral tone. -->
        <div id="tone-buttons" class="buttons tone-buttons" hidden>
          <button type="button" data-tone="1" aria-label="First tone">ā</button>
          <button type="button" data-tone="2" aria-label="Second tone">á</button>
          <button type="button" data-tone="3" aria-label="Third tone">ǎ</button>
          <button type="button" data-tone="4" aria-label="Fourth tone">à</button>
          <button type="button" data-tone="5" aria-label="Neutral tone">a</button>
          <button id="tone-next-button" class="primary" type="button" hidden>Next</button>
        </div>

        <!-- Review mode: the four grades, shown once the word is written. Filled in by review.js. -->
        <div id="grade-row" class="grade-row" hidden></div>

        <!-- Shown when a character with two accepted stroke orders was written in the mainland one. -->
        <p id="order-note" class="order-note" hidden>
          Accepted. You used the mainland stroke order; the
          <a href="https://en.wikipedia.org/wiki/Stroke_order" target="_blank" rel="noopener">MOE order</a>
          differs. Press Animate to see it.
        </p>
      </div>

      <footer>
        <button id="settings-button" class="small" type="button">Settings</button>
      </footer>

      <!-- <dialog> is the browser's built-in pop-up panel. It stays hidden until opened by settings.js. -->
      <dialog id="settings-panel" class="settings-panel">
        <h2>Settings</h2>

        <label class="setting">
          Script
          <select id="script-select">
            <option value="traditional">Traditional 繁體</option>
            <option value="simplified">Simplified 简体</option>
          </select>
        </label>

        <label class="setting">
          New words per day
          <input id="new-words-input" type="number" min="0" max="50" inputmode="numeric" />
        </label>

        <fieldset class="setting">
          <legend>Card types</legend>
          <label><input type="checkbox" data-card-type="meaning" /> Meaning: see the word, recall what it means</label>
          <label><input type="checkbox" data-card-type="pinyin" /> Pinyin: see the word, recall how it is read</label>
          <label><input type="checkbox" data-card-type="tone" /> Tone: see the word, give each tone</label>
          <label><input type="checkbox" data-card-type="writing" /> Writing: see the meaning, write the word</label>
        </fieldset>

        <div class="setting">
          <button id="export-button" class="small" type="button">Export backup</button>
          <button id="import-button" class="small" type="button">Import backup</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>

        <button id="settings-close" class="primary" type="button">Done</button>
      </dialog>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
