# Publishes the moving page at the app's old address, while the app moves to
# https://yutuchinese.com (docs/offline.md, "The move to yutuchinese.com",
# phase 2):
#
#   https://bunnyapocalypse.github.io/yutu-chinese/       the stable copy's
#   https://bunnyapocalypse.github.io/yutu-chinese/test/  the test copy's
#
# Each reads the learner's words where the old copy kept them and hands them
# to the app at yutuchinese.com/app/ (or /app/test/). The app itself is
# published there by BunnyApocalypse/yutuchinese-site (site-repo/), which
# builds this repository's stable and main; once the testers have moved,
# this workflow publishes it at yutuchinese.com itself again (phase 3).
#
# GitHub runs this when main changes a file the moving page is built from
# (see paths below), or when it is started by hand. Nothing is published if
# the unit tests fail.
#
# To release what is on main meanwhile:
#   git push origin main:stable
#   git push origin main
#   gh workflow run deploy.yml -R BunnyApocalypse/yutuchinese-site
# (A push to stable does not start this by itself: the repository only lets
# the main branch publish to Pages, and a run started from stable is turned
# away. That is a setting of the "github-pages" environment on GitHub.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only what the moving page is built from (the owner, 2026-11-10: the
    # rest of the app never reaches it, and each run risks a hung Pages).
    # Its own files, and the app's it imports: the database, the backup,
    # the sync code, the texts, the style sheet. A new import in src/move.js
    # (or a new file in move.html) goes here too.
    # In phase 3, when this publishes the app again, this list goes and
    # paths-ignore (docs/**, **.md) comes back.
    paths:
      - 'move.html'
      - 'src/move.js'
      - 'src/moveServiceWorker.js'
      - 'vite.move.config.js'
      - 'scripts/finish-move.js'
      - 'src/db.js'
      - 'src/backup.js'
      - 'src/syncCode.js'
      - 'src/style.css'
      - 'src/text.js'
      - 'src/text/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  # Also allows starting it by hand from the repository's Actions tab.
  workflow_dispatch:

# What the workflow may do: read the code, and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes come close together, the later one waits for the earlier.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Each action is named by its exact commit (the long number), with its
      # version beside it: a version name like "v7" can be moved to other
      # code by whoever controls the action, a commit cannot. Dependabot
      # proposes newer ones (docs/supply-chain.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The current long-term-support release of Node.js.
          node-version: 24
          cache: npm

      # The stable copy's moving page into dist-move/, the test copy's into
      # dist-move/test/ (vite.move.config.js). "npm ci" installs exactly what
      # package-lock.json lists; "--ignore-scripts" stops any package from
      # running code of its own while being installed (none needs to).
      - name: Build the moving pages
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build:move
          VITE_CHANNEL=test npm run build:move

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-move
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # It waits at most 10 minutes for Pages to put the files in place (a
        # longer "timeout" is cut back to that). That usually takes under a
        # minute; now and then Pages hangs and the run fails: start a fresh
        # one (docs/offline.md).
