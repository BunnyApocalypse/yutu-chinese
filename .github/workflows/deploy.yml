# Publishes the app to GitHub Pages: two copies of it, at one address.
#
#   stable branch  ->  https://bunnyapocalypse.github.io/yutu-chinese/
#                      The copy people use. It only changes when the stable
#                      branch does, which is moved forward by hand once what
#                      is on main has been tried.
#   main branch    ->  https://bunnyapocalypse.github.io/yutu-chinese/test/
#                      The test copy: every change, as soon as it is pushed.
#                      It keeps its own database (see CHANNEL in src/db.js),
#                      so trying it never touches the words and progress in
#                      the stable copy.
#
# GitHub runs this on its own computers whenever main changes, or when it is
# started by hand. Pages publishes one folder for the whole site, so both
# copies are built every time: the stable one into dist/, the test one into
# dist/test/. Nothing is published if either copy's unit tests fail.
#
# To release what is on main, move the stable branch and start this by hand:
#   git push origin main:stable
#   gh workflow run deploy.yml --ref main
# (A push to stable does not start it by itself: the repository only lets
# the main branch publish to Pages, and a run started from stable is turned
# away. That is a setting of the "github-pages" environment on GitHub.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also allows starting it by hand from the repository's Actions tab.
  workflow_dispatch:

# What the workflow may do: read the code, and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes come close together, the later one waits for the earlier.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Each branch into a folder of its own.
      - uses: actions/checkout@v7
        with:
          ref: stable
          path: stable
      - uses: actions/checkout@v7
        with:
          ref: main
          path: test
      - uses: actions/setup-node@v7
        with:
          # The current long-term-support release of Node.js.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            test/package-lock.json

      # The stable copy. "npm ci" installs exactly what package-lock.json lists.
      - name: Build the stable copy
        working-directory: stable
        run: |
          npm ci
          npm test
          npm run build

      # The test copy. VITE_CHANNEL tells the build which copy it is.
      - name: Build the test copy
        working-directory: test
        env:
          VITE_CHANNEL: test
        run: |
          npm ci
          npm test
          npm run build

      - name: Put the test copy inside the stable one
        run: mv test/dist stable/dist/test

      - uses: actions/upload-pages-artifact@v5
        with:
          path: stable/dist
      - id: deployment
        uses: actions/deploy-pages@v5
