<!doctype html>
<!--
  The app's icon: 兔 (rabbit) in jade green, written on a full moon that is
  also a sheet of paper, in the night sky. The name 玉兔 is the Jade Rabbit
  who lives on the moon.

  Drawn by scripts/make-icons.js, which opens this page in headless Chromium
  and takes a picture of it. What to draw is said after the "?":
    kind=icon      the ordinary icon (sky to the edges, the moon large)
    kind=maskable  for Android, which cuts icons into circles, rounded squares
                   and so on: the moon is kept inside the middle 80%
    kind=swatch    the samples of the light and dark looks in the
                   introduction: only the paper, the grid and the character,
                   in dark ink (the style sheet tints it for each look)
    kind=favicon   the browser tab's icon: the moon alone, with a bigger 兔
                   and no grid, on a see-through ground (the night sky's
                   dark square looked bad in a light tab bar)
    size=192       the picture's width and height in pixels

  Every texture is a real picture, in data/icon/ (see its README for where
  each comes from and its license): the 兔 and the stars were written by the
  calligrapher 南蠻大熊; the moon is a photo of washi (Japanese handmade
  paper); the sky is a photo of a watercolor ink stain, turned dark green.
  The owner chose them on 2026-11-11 from drafts (local/logo/).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="icon" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- The night sky under the ink wash: very dark green, lighter at the top. -->
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#17322c" />
          <stop offset="1" stop-color="#0e1f1b" />
        </linearGradient>
        <!-- The 兔's shape, from the calligrapher's ink (only its see-through
             parts count: "mask-type: alpha"); it cuts the jade out of a square. -->
        <mask id="brush" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
          <image id="tu" href="../data/icon/tu.png" />
        </mask>
        <clipPath id="moon-shape"><circle id="moon-clip" cx="256" cy="256" r="222" /></clipPath>
      </defs>

      <g id="sky-layer">
        <rect width="512" height="512" fill="url(#sky)" />
        <image href="../data/icon/ink-wash.jpg" width="512" height="512" opacity="0.75" />
        <!-- The stars are filled in by the script below. -->
        <g id="stars"></g>
      </g>

      <g id="moon" clip-path="url(#moon-shape)">
        <!-- The washi is blended onto a cream ground ("multiply" darkens the
             cream by the photo's own shading), so its fibers show. -->
        <rect width="512" height="512" fill="#f1e9d4" />
        <image id="paper" href="../data/icon/washi.jpg" x="34" y="34" width="444" height="444"
          preserveAspectRatio="xMidYMid slice" style="mix-blend-mode: multiply" />
        <!-- The writing grid's cross, as on the writing area. -->
        <g id="grid" stroke="#b9a983" stroke-width="2.5" stroke-dasharray="12 9" opacity="0.45">
          <line x1="256" y1="0" x2="256" y2="512" />
          <line x1="0" y1="256" x2="512" y2="256" />
        </g>
        <rect id="ink" width="512" height="512" fill="#23704f" mask="url(#brush)" />
      </g>
    </svg>

    <script>
      const options = new URLSearchParams(location.search);
      const kind = options.get('kind') || 'icon';
      const size = Number(options.get('size') || 512);

      const icon = document.getElementById('icon');
      icon.setAttribute('width', size);
      icon.setAttribute('height', size);

      // The 兔, centered a little below the middle; tu.png is 1492 x 1641
      // pixels. height is in the icon's own units (the icon is 512 across).
      function placeCharacter(height) {
        const width = (height * 1492) / 1641;
        const tu = document.getElementById('tu');
        tu.setAttribute('x', 256 - width / 2);
        tu.setAttribute('y', 262 - height / 2);
        tu.setAttribute('width', width);
        tu.setAttribute('height', height);
      }
      placeCharacter(300);

      // Five stars, each a speck of the calligrapher's ink: x, y, size,
      // turn (degrees), which speck, how bright. Placed unevenly on purpose.
      const stars = [
        [40, 60, 14, -15, 1, 1],
        [128, 22, 10, 10, 3, 0.85],
        [478, 112, 16, 30, 4, 1],
        [30, 396, 11, 5, 2, 0.9],
        [440, 486, 13, 45, 1, 0.95],
      ];
      document.getElementById('stars').innerHTML = stars
        .map(
          ([x, y, h, turn, speck, brightness], n) => `
            <mask id="star-${n}" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
              <image href="../data/icon/speck-${speck}.png" x="${x - h / 2}" y="${y - h / 2}" width="${h}" height="${h}"
                transform="rotate(${turn} ${x} ${y})" />
            </mask>
            <rect width="512" height="512" fill="#f3ead2" opacity="${brightness}" mask="url(#star-${n})" />`,
        )
        .join('');

      const moon = document.getElementById('moon');

      if (kind === 'maskable') {
        // Android may cut away everything outside a circle of 80% of the
        // width; the moon, shrunk to 86% around the middle, stays inside it.
        moon.setAttribute('transform', 'translate(256 256) scale(0.86) translate(-256 -256)');
      }

      if (kind === 'swatch') {
        // Paper to the edges, no sky, the character in dark ink.
        document.getElementById('sky-layer').remove();
        document.getElementById('moon-clip').setAttribute('r', 400);
        const paper = document.getElementById('paper');
        paper.setAttribute('x', 0);
        paper.setAttribute('y', 0);
        paper.setAttribute('width', 512);
        paper.setAttribute('height', 512);
        document.getElementById('ink').setAttribute('fill', '#1d1c19');
      }

      if (kind === 'favicon') {
        // The moon alone, filling the picture, with a bigger 兔 and no grid:
        // at 16 to 32 pixels anything finer is a smudge.
        document.getElementById('sky-layer').remove();
        document.getElementById('grid').remove();
        moon.setAttribute('transform', 'translate(256 256) scale(1.15) translate(-256 -256)');
        placeCharacter(350);
      }
    </script>
  </body>
</html>
