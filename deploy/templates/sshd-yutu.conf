# Logging in: with a key only, never a password, and never straight in as
# root (the admin account uses sudo). Written by Ansible (deploy/setup.yml).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Fewer tries, and less time, for each connection that hasn't logged in.
# (sshd also slows down an address that keeps failing by itself, its
# PerSourcePenalties, on since OpenSSH 9.8; AlmaLinux 10 has 9.9.)
MaxAuthTries 3
LoginGraceTime 30
