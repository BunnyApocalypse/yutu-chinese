# Ansible's settings for these playbooks, read when they are run from this
# folder (cd deploy). deploy/README.md says how to use them.
[defaults]
inventory = inventory.yml
# Say clearly which tasks changed something.
stdout_callback = default
display_skipped_hosts = false
# Python on the server is found by itself.
interpreter_python = auto_silent

[ssh_connection]
# One SSH connection reused for every task: much quicker.
pipelining = true
# Ansible's usual SSH options (one connection kept open for a minute), plus
# never trying Kerberos (GSSAPI) first. Fedora's SSH tries it by default; the
# tries hang, and the server counts each as a failed login and soon refuses
# this computer for a while ("Not allowed at this time"; 2026-11-13).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o GSSAPIAuthentication=no
