# Whether the world reaches the sync server through HTTPS, at each name it
# answers to (sync_domain, then sync_extra_domains). Not a failure if not
# (yet): a name may not point at the server, or Caddy may still be getting
# its certificate. Said plainly instead.
- name: The server answers at each of its names
  ansible.builtin.uri:
    url: "https://{{ item }}/v1/health"
    return_content: true
  loop: "{{ [sync_domain] + sync_extra_domains }}"
  register: public_health
  until: public_health.status == 200
  retries: 6
  delay: 10
  failed_when: false
  tags: [public]

- name: Said if not
  ansible.builtin.debug:
    msg: >-
      https://{{ item.item }} doesn't answer yet ({{ item.msg | default('') }}).
      Check that its DNS records point at this server; Caddy gets its
      certificate by itself once they do. Run status.yml to look again.
  loop: "{{ public_health.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) != 200
  tags: [public]
